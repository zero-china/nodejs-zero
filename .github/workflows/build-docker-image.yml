name: Build and Push Docker Image

on:
  push:
    branches: 
      - main
      - tongyue  # 👈 加上这一行！这样你在 tongyue 分支提交代码时，就会自动触发构建
    paths:
      - 'Dockerfile'
      - 'index.js'
      - 'package.json'
  pull_request:
    branches: [ main ]
  workflow_dispatch: # 👈 这一行保留得太对了！它允许你以后在网页上手动点击运行了

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/zero-yue:2026
            ghcr.io/${{ github.repository_owner }}/zero-yue:tongyue
          # 👆 上面我帮你保留了 :2026，同时多加了一个 :tongyue 标签。这样两个名字都能访问到它！
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=HTTP Server
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
